[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=6.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethopy-analysis"
dynamic = ["version"]
description = "Data analysis and visualization package for Ethopy behavioral experiments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ethopy Analysis Contributors"}
]
keywords = ["neuroscience", "behavior", "data-analysis", "visualization", "ethopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.9"
# Upper bounds are applied only where a specific incompatibility is known and
# reproducible. Speculative caps ("the next major might break us") are avoided:
# they cannot prevent breakage, they only make the package uninstallable
# alongside newer dependencies, and lifting one requires a release. For a
# byte-for-byte reproducible environment use constraints.txt instead.
dependencies = [
    # Capped: datajoint 2.0 is a documented breaking API change.
    "datajoint>=0.14.0,<2.0.0",
    "setuptools<82",
    # Capped: PyMySQL 1.2.0 attempts TLS opportunistically, so connecting to a
    # server with legacy TLS (e.g. MySQL 5.7) fails with
    # SSLV3_ALERT_HANDSHAKE_FAILURE. This is not configurable from here:
    # datajoint's use_tls=False merely omits the `ssl` argument, and never
    # passes PyMySQL's `ssl_disabled=True`, which is the only setting that
    # connects. PyMySQL arrives transitively via datajoint, which does not
    # bound it. Drop this cap once datajoint passes ssl_disabled.
    "pymysql<1.2.0",
    # Uncapped: verified working against pandas 3.0.5 / numpy 2.5.2 /
    # matplotlib 3.11.1 on Python 3.13.
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "seaborn>=0.11.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "black>=22.0.0,<26.0.0",
    "isort>=5.10.0,<7.0.0",
    "flake8>=4.0.0,<8.0.0",
    "mypy>=0.950,<2.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "ipykernel>=6.0.0,<7.0.0",
]
docs = [
    "mkdocs>=1.4.0,<2.0.0",
    "mkdocs-material>=8.0.0,<10.0.0",
    "mkdocstrings[python]>=0.19.0,<1.0.0",
]
# Jupyter kernel for the example notebooks; not needed by the library itself.
notebooks = [
    "ipykernel>=6.0.0,<7.0.0",
    "jupyter>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ef-lab/ethopy_analysis"
Repository = "https://github.com/ef-lab/ethopy_analysis"
Documentation = "https://ef-lab.github.io/ethopy_analysis"
"Bug Tracker" = "https://github.com/ef-lab/ethopy_analysis/issues"

[project.scripts]
ethopy-analysis = "ethopy_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ethopy_analysis" = ["*.json", "*.md"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["ethopy_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --cov=ethopy_analysis"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.setuptools_scm]
write_to = "src/ethopy_analysis/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"